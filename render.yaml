services:
  - type: web
    name: rekaquest
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data/rekaquest
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_PASSCODE
        sync: false
    disk:
      name: rekaquest-data
      mountPath: /var/data
      sizeGB: 1
